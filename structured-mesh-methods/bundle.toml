title = "Structured mesh methods"
summary = "Structured and curvilinear mesh generation and its numerical consequences, 1966–2026: boundary-fitted coordinate systems from transfinite interpolation and from elliptic (Winslow, Thompson), hyperbolic and variational generators, mesh-point clustering, adaptive and moving meshes (equidistribution, moving mesh PDEs, r- and hr-adaptivity), algebraic mesh quality metrics and target-matrix mesh optimization, high-order curvilinear meshes (validity, untangling, morphing, curving third-party meshes), metric identities, the geometric conservation law and free-stream preservation of finite-difference, WENO, DG and flux-reconstruction schemes, shock fitting on structured grids, hex meshing and machine-learning mesh generation."
