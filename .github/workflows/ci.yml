name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  check:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install the tools
      run: pip install -e ".[dev]"

    - name: Lint and format of the tools
      run: |
        ruff check .
        ruff format --check .

    - name: Tool tests
      run: pytest

    - name: OKF lint of every bundle
      run: |
        for card in */bundle.toml; do
          bundle="$(dirname "$card")"
          echo "== $bundle"
          python tools/lint_okf.py "$bundle/wiki"
        done

    - name: Bundle registry in sync
      run: python tools/bundles.py --check
