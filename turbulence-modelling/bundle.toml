title = "Turbulence modelling and scale-resolving simulation"
summary = "Turbulence modelling and simulation, 2017–2026: RANS closures (Spalart–Allmaras, k-ω SST, Reynolds-stress models) and laminar–turbulent transition models, large-eddy simulation (subgrid-scale models, explicit and implicit LES, filtering), wall models, hybrid RANS/LES (DES, PANS), data-driven and machine-learned closures (field inversion, symbolic regression, neural-network and reinforcement-learning models), high-order discretizations for scale-resolving simulation (DG, flux reconstruction, spectral elements, gas-kinetic schemes, kinetic-energy-preserving schemes), DNS of compressible and hypersonic boundary layers, immersed boundaries and mesh adaptation, turbulent combustion, and MHD, astrophysical and plasma turbulence."
