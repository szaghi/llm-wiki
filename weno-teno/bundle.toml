title = "WENO, TENO and high-order compressible-flow schemes"
summary = "High-order discretizations of hyperbolic conservation laws and compressible flows, 2021–2026: nonlinear reconstruction (WENO-JS, Z, Z+, ZN, affine-invariant, alternative and multi-resolution WENO, Hermite WENO, WCNS, TENO, CWENO, THINC hybrids, gradient-based and learned reconstruction), central-upwind schemes and characteristic decomposition, discontinuous Galerkin and flux reconstruction (entropy-stable and kinetic-energy-preserving split forms, subcell and convex limiting, OEDG, filtering), bound preservation (geometric quasilinearization, optimal cell-average decomposition), well-balanced and asymptotic-preserving schemes, Active Flux, shock tracking and moving meshes, immersed boundaries, multiphase flows and the GPU and AMR solvers that implement them."
